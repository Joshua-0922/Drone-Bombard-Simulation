# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    server_name 136.113.193.83;
    return 301 https://$host$request_uri;
}

# HTTPS 메인 서버
server {
    listen 443 ssl;
    server_name 136.113.193.83;

    ssl_certificate     /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    # 보안 프로토콜 설정 (TLS 1.2/1.3만 허용)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 루트 접속 시 /guacamole/ 로 리다이렉트
    location = / {
        return 301 /guacamole/;
    }

    # Guacamole 웹 애플리케이션 프록시
    # WebSocket 터널링을 위해 Upgrade/Connection 헤더 필수
    location /guacamole/ {
        proxy_pass http://guacamole:8080/guacamole/;
        proxy_http_version 1.1;

        # WebSocket 업그레이드 (Guacamole 터널 필수)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 표준 프록시 헤더
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 버퍼링 비활성화 (VNC 스트리밍 성능)
        proxy_buffering off;

        # VNC 세션 유지를 위한 긴 타임아웃
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10s;
    }
}
