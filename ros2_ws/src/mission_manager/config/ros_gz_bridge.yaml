# ros_gz_bridge configuration for Gazebo Harmonic <-> ROS 2 Humble
# =================================================================
# RL training variant: camera and IMU bridges removed to reduce
# message-processing overhead. Only clock, payload odometry, and
# drop command are bridged.
#
# Package required: ros-humble-ros-gzharmonic-bridge
#   Install: sudo apt install ros-humble-ros-gzharmonic
#
# Direction values:
#   GZ_TO_ROS   : Gazebo publishes -> ROS2 subscribes
#   ROS_TO_GZ   : ROS2 publishes  -> Gazebo subscribes

# ------------------------------------------------------------------
# Clock synchronization (critical: ROS2 nodes use /clock for sim time)
# ------------------------------------------------------------------
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# ------------------------------------------------------------------
# Payload position
# Published by gz::sim::systems::OdometryPublisher in payload.sdf
# ------------------------------------------------------------------
- ros_topic_name: "/drone/payload/position"
  gz_topic_name: "/model/payload_cylinder/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# ------------------------------------------------------------------
# Payload drop command
# DetachableJoint plugin listens on /x500_bombard/drop (gz.msgs.Empty)
# ------------------------------------------------------------------
- ros_topic_name: "/payload/drop_cmd"
  gz_topic_name: "/x500_bombard/drop"
  ros_type_name: "std_msgs/msg/Empty"
  gz_type_name: "gz.msgs.Empty"
  direction: ROS_TO_GZ

