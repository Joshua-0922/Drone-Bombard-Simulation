training:
  total_timesteps: 150000   # Round 1 — Issue #001+#002+#003+#006 동시 적용
  checkpoint_freq: 5000
  max_checkpoints_kept: 5
  checkpoint_dir: "/workspace/ros2_ws/rl_checkpoints"
  num_envs: 1
  env_stagger_secs: 10
  eval_freq: 10000
  eval_episodes: 3

sac:
  learning_rate: 3.0e-4
  buffer_size: 500000
  batch_size: 256
  tau: 0.005
  gamma: 0.995
  learning_starts: 1000
  gradient_steps: 1
  net_arch: [256, 256]
  device: "cuda"

environment:
  target_enu_x: 11.0
  target_enu_y: 10.0
  pos_scale: 50.0
  vel_scale: 15.0
  ang_vel_scale: 3.14159265
  action_vx_scale: 8.0
  action_vy_scale: 5.0
  action_vz_scale: 3.0
  action_yaw_scale: 1.0
  action_rate_limit: 0.2
  max_steps: 800
  min_altitude: 3.0
  min_altitude_start_step: 1    # Issue #002: 10 → 1 (grace period 최소화)
  ground_contact_altitude: 0.5  # Issue #002: 신규 — altitude < 0.5m → 무조건 crash
  max_distance: 100.0           # Issue #002: 신규 — d_xy > 100m → out_of_range truncate
  max_altitude: 25.0            # Round 2: 고도 상한 — 25m 초과 시 truncate
  stagnation_window: 300        # vision-fix: 300 step 동안
  stagnation_min_progress: 3.0  # vision-fix: d_xy 최소 3m 감소 필요
  stagnation_start_step: 400    # vision-fix: step 400 이후부터 체크 (탐색 시간 확보)
  obs_wait_timeout: 0.02
  cruise_poll_timeout: 60.0
  use_vision: true

reward:
  # --- Approach shaping ---
  w_dist: 1.0
  w_heading: 0.7
  speed_gate_enabled: true

  # --- Vision centering ---
  w_vision_center: 1.0          # reward for X marker at camera centre (0=edge, 1=centre)

  # --- Stability/efficiency ---
  w_time: 0.05
  w_ang_vel: 0.05
  w_action_smooth: 0.05

  # --- Layer 1 penalties ---
  penalty_crash: -50.0
  penalty_overspeed: -30.0
  penalty_target_lost: -10.0
  penalty_out_of_range: -30.0
  penalty_max_altitude: -30.0
  penalty_stagnation: -15.0
  penalty_bad_attitude: -30.0
  limit_ang_vel: 2.0
  limit_tilt: 0.26

  # --- Episode termination penalties ---
  truncation_penalty: -15.0

wandb:
  project: "drone-bombard-sac"
  entity: "nayoonho0922-seoul-national-university"
  run_name: "rl_yolo_v2_proximity_fix"
  tags: ["sac", "spot-vm", "l4-gpu", "round1"]
  save_model_artifact: true
  log_freq: 1000
