training:
  total_timesteps: 300000   # v5: more steps — each episode resets after detection, not from scratch
  checkpoint_freq: 5000
  max_checkpoints_kept: 5
  checkpoint_dir: "/workspace/ros2_ws/rl_checkpoints"
  num_envs: 1
  env_stagger_secs: 10
  eval_freq: 10000
  eval_episodes: 3

sac:
  learning_rate: 3.0e-4
  buffer_size: 500000
  batch_size: 256
  tau: 0.005
  gamma: 0.995
  learning_starts: 1000
  gradient_steps: 1
  net_arch: [256, 256]
  device: "cuda"

environment:
  target_enu_x: -11.0   # EKF East = -Gazebo_East. Marker at Gazebo East=11 → EKF_East=-11
  target_enu_y: 10.0
  pos_scale: 50.0
  vel_scale: 15.0
  ang_vel_scale: 3.14159265
  action_vx_scale: 8.0
  action_vy_scale: 5.0
  action_vz_scale: 3.0
  action_yaw_scale: 1.0
  action_rate_limit: 0.2
  max_steps: 400             # v5: drone starts near marker; 400 steps is enough
  min_altitude: 3.0
  min_altitude_start_step: 1
  ground_contact_altitude: 0.5
  max_distance: 100.0
  max_altitude: 25.0
  stagnation_window: 150     # v5: shorter window — drone already near target
  stagnation_min_progress: 1.0  # v5: 3.0 → 1.0m (already close, small progress expected)
  stagnation_start_step: 50     # v7: first check fires at step 200 (50+150 window); catches EKF-drifted episodes
  obs_wait_timeout: 0.02
  cruise_poll_timeout: 120.0
  tracking_wait_timeout: 60.0   # max wait for CRUISE→TRACKING; drone needs ~25s cruise before marker enters YOLO view
  use_vision: true

reward:
  # --- Approach shaping ---
  w_dist: 2.0      # v5: stronger GPS gradient (still useful for fine approach)
  w_heading: 1.0   # v5: stronger heading alignment
  speed_gate_enabled: true

  # --- Vision centering ---
  w_vision_center: 1.5          # v5: boost vision centering (primary objective now)

  # --- Stability/efficiency ---
  w_time: 0.05
  w_ang_vel: 0.05
  w_action_smooth: 0.05

  # --- Layer 1 penalties ---
  penalty_crash: -50.0
  penalty_overspeed: -30.0
  penalty_target_lost: -0.1     # v7: reduced further; camera FOV gap means lost is structural not behavioral
  penalty_out_of_range: -30.0
  penalty_max_altitude: -30.0
  penalty_stagnation: -15.0
  penalty_bad_attitude: -30.0
  limit_ang_vel: 2.0
  limit_tilt: 0.26

  # --- Episode termination penalties ---
  truncation_penalty: -15.0

wandb:
  project: "drone-bombard-sac"
  entity: "nayoonho0922-seoul-national-university"
  run_name: "rl_yolo_v7_drift_guard"
  tags: ["sac", "spot-vm", "l4-gpu", "ekf-drift-guard", "proximity-2.5m", "penalty-0.1"]
  save_model_artifact: true
  log_freq: 1000
