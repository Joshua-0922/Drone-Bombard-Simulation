training:
  total_timesteps: 1000000
  checkpoint_freq: 5000
  max_checkpoints_kept: 5        # keep only last 5 rolling checkpoints
  checkpoint_dir: "/workspace/ros2_ws/rl_checkpoints"
  num_envs: 1              # Stable single-env (multi-env Gazebo lockstep overhead > benefit)
  env_stagger_secs: 10    # 10s stagger between SubprocVecEnv instance inits

sac:
  learning_rate: 3.0e-4
  buffer_size: 100000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  learning_starts: 1000
  gradient_steps: 1         # SAC gradient updates per env step (Week 3 HP tuning: try 2)
  net_arch: [256, 256]
  device: "cuda"            # L4 GPU; change to "cpu" if no GPU available

environment:
  target_enu_x: 11.0
  target_enu_y: 10.0
  pos_scale: 50.0
  vel_scale: 15.0
  ang_vel_scale: 3.14159265
  action_vx_scale: 15.0
  action_vy_scale: 5.0
  action_vz_scale: 3.0
  action_yaw_scale: 1.0
  max_steps: 500
  min_altitude: 2.0
  min_altitude_start_step: 20
  obs_wait_timeout: 0.02     # 20 ms — 10x safety margin at 500 Hz wall-clock (PX4_SIM_SPEED_FACTOR=10)
  cruise_poll_timeout: 60.0
  use_vision: false          # disable camera-based obs/termination for RL training

reward:
  # --- Physics ---
  g: 9.81                   # gravity (m/s^2)

  # --- Auto-drop (Phase 1 CCIP: fires when predicted impact point ≤ threshold) ---
  auto_drop_threshold: 0.5  # fire drop when CCIP d_impact <= this (m); was d_xy in pre-Phase1
  drop_wait_timeout: 10.0   # seconds to wait for actual physics landing result from drop_calculator

  # --- Approach shaping (Layer 3) ---
  k1_potential: 1.0         # UNUSED — kept for reference. Was: exp(-k1*d) potential (saturated at d>10m)
  w_dist: 1.0               # linear distance reward weight: r3_dist = w_dist*(d_prev - d_now)
                             # (reduced from 10.0: linear is unbounded, exponential was bounded by 1)
  w_heading: 1.0            # weight for heading alignment (cos delta_yaw)
  speed_gate_enabled: true  # false = disable speed gate → reproduces Spiral Milking (ablation Exp 007a)

  # --- d_impact shaping (Layer 3 addition) ---
  w_impact: 2.0             # weight for CCIP predicted miss distance reward: w_impact * exp(-k_impact * d_impact)
  k_impact: 0.05            # decay constant (smaller = nonzero gradient at longer range)

  # --- Stability/efficiency (Layer 2) ---
  w_time: 0.01              # per-step time penalty
  w_ang_vel: 0.05           # penalty weight for ||omega||^2
  w_action_smooth: 0.05     # penalty weight for ||action_t - action_{t-1}||^2

  # --- Terminal drop accuracy (Layer 4) ---
  k2_precision: 5.0         # precision decay constant for drop reward
  w_drop_base: 50.0         # base weight for drop accuracy reward
  r_success_jackpot: 100.0  # bonus for landing within success_threshold
  success_threshold: 0.1    # distance threshold for jackpot (m)
  penalty_instability: 50.0 # subtracted if drone is unstable at drop
  limit_ang_vel: 2.0        # rad/s — instability threshold for angular velocity
  limit_tilt: 0.26          # rad (~15 deg) — instability threshold for roll/pitch

  # --- Layer 1 penalties (no hard termination; episode continues) ---
  penalty_crash: -10.0      # altitude below min_altitude after step 20
  penalty_overspeed: -8.0   # speed > 20 m/s
  penalty_target_lost: -10.0 # vision confidence == 0 (only if use_vision: true)

wandb:
  project: "drone-bombard-sac"
  entity: "nayoonho0922-seoul-national-university"  # team entity (personal entities disabled)
  run_name: "L4-AutoDrop-v1"            # Auto-generated if null
  tags: ["sac", "spot-vm", "l4-gpu"]
  save_model_artifact: true
  log_freq: 1000            # gradient_save_freq for WandbCallback (increased to avoid blocking training loop)
