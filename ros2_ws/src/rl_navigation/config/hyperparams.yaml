training:
  total_timesteps: 300000   # Round 7 resilient v1 → v2: 99807에서 resume, 300k 목표
  checkpoint_freq: 5000
  max_checkpoints_kept: 5
  checkpoint_dir: "/workspace/ros2_ws/rl_checkpoints"
  num_envs: 1
  env_stagger_secs: 10
  eval_freq: 10000
  eval_episodes: 3

sac:
  learning_rate: 1.0e-4    # Round 3: 3e-4 → 1e-4 (critic overshoot 완화)
  buffer_size: 500000
  batch_size: 256
  tau: 0.002               # Round 3: 0.005 → 0.002 (target network 안정화)
  gamma: 0.995
  learning_starts: 1000
  gradient_steps: 1
  net_arch: [256, 256]
  device: "cuda"
  # Round 3: PER (Prioritized Experience Replay) — Issue #016 처방
  use_per: true
  per_alpha: 0.6           # priority 강도 (0=uniform, 1=full priority)
  per_eps: 0.1             # priority 최소값 (zero priority 방지)
  per_priority_max: 30.0   # Round 3: priority 상한 (outlier 폭주 방지)
  # Round 6: ent_coef 발산 방지 (Round 4/5에서 ent_coef 6.0+ 폭주)
  ent_damping_threshold: 5.0   # log_prob 집중도 임계 (soft damping)
  ent_coef_hard_cap: 1.0       # Round 7: 2.0→1.0 (안전망 강화, 발산 시도 학습 가능 수준)
  # Round 7: target_entropy 명시 — bounded action space에 맞게 deterministic 허용
  # default(-|A|=-5)는 unbounded Gaussian 기준이라 squash 환경에서 alpha 폭주 유발
  target_entropy: -15.0
  # Round 7 v3 (#021): critic stability — target Q clipping + Huber loss.
  # critic_loss 폭발 (Round 7 v2 에서 68 → 2.13M 관찰) → ent_coef 발산 trigger.
  # reward 스케일 ±200 고려 ±500 으로 boost 차단. 0 = 비활성화.
  target_q_clip: 500.0

environment:
  target_enu_x: 4.0       # Phase 1 redux: 11 → 4 (spawn 부터 거리 14.87m → 5m, 쉬운 task)
  target_enu_y: 3.0       # 10 → 3
  pos_scale: 50.0
  vel_scale: 15.0
  ang_vel_scale: 3.14159265
  action_vx_scale: 8.0
  action_vy_scale: 5.0
  action_vz_scale: 3.0
  action_yaw_scale: 1.0
  action_rate_limit: 0.2
  max_steps: 800
  min_altitude: 3.0
  min_altitude_start_step: 1    # Issue #002: 10 → 1 (grace period 최소화)
  ground_contact_altitude: 0.5  # Issue #002: 신규 — altitude < 0.5m → 무조건 crash
  max_distance: 100.0           # Issue #002: 신규 — d_xy > 100m → out_of_range truncate
  # stagnation 제거 — speed_gate가 이미 hover 보상 차단함
  max_altitude: 50.0            # Round 3: 비행 중 50m 초과 → truncate (-15 페널티)
  obs_wait_timeout: 0.02
  cruise_poll_timeout: 60.0
  use_vision: false
  # Round 7 (2차 처방): drop 없이 fast-path reset 누적 cap.
  # 100 episode 마다 강제 full restart → Gazebo 누적 leak 차단.
  # 비용 ~4% slowdown. 0 = 비활성화.
  max_consecutive_fast_resets: 100

reward:
  # --- Physics ---
  g: 9.81

  # --- Drop trigger (hybrid: manual + auto safety net) ---
  auto_drop_threshold: 1.0     # Phase 1 redux v2: 3.0 → 1.0 (정밀 drop 강제)
  # manual drop 비활성 — action[4] 무시 ("drop ASAP" exploit 방지)
  random_drop_start_step: 600  # Round 2: 150→600 (600 step 자유 접근 확보)
  random_drop_prob: 0.0        # Phase 1 redux: 0.005 → 0 (정책 자체 drop 능력 학습 강제)
  drop_wait_timeout: 10.0

  # --- Approach shaping (Layer 3) ---
  k1_potential: 1.0
  w_dist: 1.0
  w_heading: 0.7            # Round 5: 0.3 → 0.7 복원 (Round 4 발산 원인)
  w_distance_penalty: 0.0   # Round 5: 0.03 → 0 비활성 (Round 4 발산 원인)
  speed_gate_enabled: true

  # --- d_impact shaping (Layer 3 addition) ---
  w_impact: 0.4
  k_impact: 0.05

  # --- Stability/efficiency (Layer 2) ---
  w_time: 0.01
  w_ang_vel: 0.05
  w_action_smooth: 0.05

  # --- Terminal drop accuracy (Layer 4) ---
  k2_precision: 0.2            # Round 2: 0.5 → 0.2 (10m 구간 gradient 확보)
  w_prediction: 20.0           # Issue #010: CCIP 예측-실제 일치도 보상 가중치
  k_prediction: 0.1            # Issue #010: prediction gap 감쇠 (0.1 = 완만, gap 12m에서도 신호 유지)
  w_drop_base: 100.0
  r_success_jackpot: 50.0      # Issue #003: 100 → 50 (스케일 축소)
  success_threshold: 1.0            # Phase 1 redux v2: 5.0 → 1.0 (정밀 명중 강제)
  jackpot_threshold: 0.3            # Phase 1 redux v2: 0.1 → 0.3 (10cm 너무 빡빡 → 30cm 도전 가능)
  penalty_instability: 50.0
  limit_ang_vel: 2.0
  limit_tilt: 0.26

  # --- Step 별 안전 검사 ---
  limit_inverted_tilt: 1.047
  penalty_bad_attitude: -30.0   # Issue #003: -50 → -30 (스케일 축소)

  # --- Episode termination penalties ---
  drop_attempt_bonus: 30.0      # Issue #001+#003: 150 → 30 (precision 비중 상승)
  k_drop_proximity: 0.15        # Round 2: 0.3 → 0.15 (10m 구간에서도 bonus 유지)
  truncation_penalty: -15.0     # Issue #003: -30 → -15 (스케일 축소)

  # --- Layer 1 penalties ---
  penalty_crash: -50.0          # Issue #003: -100 → -50 (스케일 축소)
  penalty_overspeed: -30.0      # Issue #003: -50 → -30 (스케일 축소)
  penalty_target_lost: -10.0
  penalty_out_of_range: -30.0   # Issue #002: 신규 — out_of_range truncate 페널티
  penalty_max_altitude: -15.0   # Round 3: 50m 초과 시 truncate 페널티 (timeout과 동일)
  # --- Hover 감지 (Round 5: 속도 기준 연속 정체) ---
  # Episode 종료 시 1회 페널티 (drop 시 제외) — per-step density 영향 없음
  hover_speed_threshold: 1.0           # m/s — 이 이하면 정지로 판단
  hover_consecutive_threshold: 200     # step — 연속 정체 한계
  penalty_hover: -15.0                 # 페널티 (잠시 hover OK, 지속만 BAD)
  # --- Drop 시점 고도 페널티 (Round 3): sigmoid bounded (지수 폐기, -6.77e9 폭주 방지) ---
  # penalty = -alt_penalty_max * sigmoid(alt_penalty_k * (alt - alt_penalty_mid))
  alt_penalty_max: 50.0         # 최대 페널티 절대값
  alt_penalty_mid: 30.0         # 50% 페널티 도달 고도
  alt_penalty_k: 0.15           # slope

wandb:
  project: "drone-bombard-sac"
  entity: "nayoonho0922-seoul-national-university"
  run_name: "phase1_redux_v2_tight_thresholds"
  tags: ["sac", "spot-vm", "l4-gpu", "round1"]
  save_model_artifact: true
  log_freq: 1000
